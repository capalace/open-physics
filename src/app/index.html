<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Physics</title>
</head>
<body>
  <header>
    <strong>Open Physics</strong>
    <nav aria-label="물리 영역">
      <button>역학</button><button>전자기학</button><button>파동</button><button>빛</button><button>열</button><button>현대물리</button>
    </nav>
  </header>
  <main>
    <div class="toolbar">
      <button id="play">▶ 실행</button>
      <button id="reset">↻ 초기화</button>
      <button id="add-circle">+ 원</button>
      <button id="add-box">+ 상자</button>
    </div>
    <canvas id="physics-canvas" width="960" height="600"></canvas>
    <div class="controls">
      <label>중력 <input id="gravity" type="number" value="9.8" step="0.1" /> m/s²</label>
      <span>객체를 직접 드래그할 수 있습니다.</span>
    </div>
  </main>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
