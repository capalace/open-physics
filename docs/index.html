<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Physics</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #101216; color: #f4f4f5; }
    header { padding: 24px 32px; border-bottom: 1px solid #2a2d34; }
    main { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 82px); }
    aside { padding: 20px; border-right: 1px solid #2a2d34; }
    button { display: block; width: 100%; margin: 8px 0; padding: 10px; border: 1px solid #383c45; border-radius: 8px; background: #191c22; color: inherit; cursor: pointer; }
    button:hover { background: #242831; }
    section { padding: 24px; }
    canvas { width: 100%; max-width: 1000px; height: min(70vh, 650px); display: block; background: #080a0d; border: 1px solid #2a2d34; border-radius: 12px; }
    .status { color: #a1a1aa; margin-bottom: 16px; }
  </style>
</head>
<body>
  <header><strong>Open Physics</strong> — Interactive Physics Playground</header>
  <main>
    <aside>
      <div>물리 영역</div>
      <button data-mode="mechanics">역학</button>
      <button data-mode="electromagnetism">전자기학</button>
      <button data-mode="waves">파동</button>
      <button data-mode="optics">빛</button>
      <button data-mode="thermal">열</button>
      <button data-mode="modern">현대물리</button>
    </aside>
    <section>
      <div class="status" id="status">역학 · 중력장 · 드래그하여 물체를 배치하세요.</div>
      <canvas id="canvas" width="1200" height="700"></canvas>
    </section>
  </main>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const body = { x: 300, y: 100, vx: 90, vy: 0, radius: 18 };
    let running = true;
    let dragging = false;
    let last = performance.now();

    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.033);
      last = now;
      if (running && !dragging) {
        body.vy += 400 * dt;
        body.x += body.vx * dt;
        body.y += body.vy * dt;
        if (body.y + body.radius > canvas.height) {
          body.y = canvas.height - body.radius;
          body.vy *= -0.75;
        }
        if (body.x - body.radius < 0 || body.x + body.radius > canvas.width) body.vx *= -1;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#30343d';
      ctx.beginPath(); ctx.moveTo(0, canvas.height - 1); ctx.lineTo(canvas.width, canvas.height - 1); ctx.stroke();
      ctx.fillStyle = '#f4f4f5';
      ctx.beginPath(); ctx.arc(body.x, body.y, body.radius, 0, Math.PI * 2); ctx.fill();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener('pointerdown', e => {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) * canvas.width / r.width;
      const y = (e.clientY - r.top) * canvas.height / r.height;
      if (Math.hypot(x - body.x, y - body.y) <= body.radius + 10) { dragging = true; canvas.setPointerCapture(e.pointerId); }
    });
    canvas.addEventListener('pointermove', e => {
      if (!dragging) return;
      const r = canvas.getBoundingClientRect();
      body.x = (e.clientX - r.left) * canvas.width / r.width;
      body.y = (e.clientY - r.top) * canvas.height / r.height;
      body.vx = 0; body.vy = 0;
    });
    canvas.addEventListener('pointerup', () => { dragging = false; });
    document.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
      const labels = { mechanics: '역학', electromagnetism: '전자기학', waves: '파동', optics: '빛', thermal: '열', modern: '현대물리' };
      status.textContent = `${labels[button.dataset.mode]} · 물리 모델 준비 중`;
    }));
    requestAnimationFrame(frame);
  </script>
</body>
</html>
